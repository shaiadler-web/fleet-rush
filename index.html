:root{
  /* Element brand palette */
  --teal:#00D7D2; --blue:#05AFDC; --mint:#AAFFD2; --ice:#BEFFFA; --sky:#96BED2; --slate:#4B6478; --steel:#B9C8CD; --mist:#C8DCEB; --bad:#BF2E2E;
  --bg:#E3E3E3; --surface:#FFFFFF; --surface-2:#F5F5F5; --ink:#3C3C3C; --muted:#46505A; --line:#E3E3E3;
  --btn:#3C3C3C; --btn-ink:#FFFFFF; --hero:#00D7D2; --hero-ink:#3C3C3C;
  --font:"Euclid Circular B",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F2328; --surface:#3C3C3C; --surface-2:#46505A; --ink:#F5F5F5; --muted:#E3E3E3; --line:#4B6478;
    --btn:#00D7D2; --btn-ink:#3C3C3C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F2328; --surface:#3C3C3C; --surface-2:#46505A; --ink:#F5F5F5; --muted:#E3E3E3; --line:#4B6478;
  --btn:#00D7D2; --btn-ink:#3C3C3C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;gap:12px;padding:12px}
button,input,select{font:inherit;color:inherit}

.review{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13px;color:var(--muted);max-width:1180px;width:100%;margin:0 auto}
.review strong{color:var(--ink);font-weight:600}
.review label{display:flex;align-items:center;gap:6px}
.review select,.review button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
.review .jump{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

.stage{position:relative;aspect-ratio:4/3;width:min(100%, calc((100dvh - 90px) * 4 / 3), 1180px);margin:0 auto;background:var(--surface-2);border-radius:24px;overflow:hidden;container-type:inline-size;touch-action:manipulation}
.ui{position:absolute;inset:0;font-size:1.6cqw;display:flex;flex-direction:column}
.noselect{user-select:none;-webkit-user-select:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1.8em 2.4em .4em}
.lockup{height:2.1em;display:block}
.lockup.white{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lockup.color{display:none} :root:not([data-theme="light"]) .lockup.white{display:block} }
:root[data-theme="dark"] .lockup.color{display:none}
:root[data-theme="dark"] .lockup.white{display:block}
.event{font-size:1em;color:var(--muted);font-weight:500}
.screen{flex:1;display:flex;flex-direction:column;padding:1em 2.4em 2.4em;min-height:0}

/* Welcome */
.welcome{display:grid;grid-template-columns:1.15fr 1fr;gap:1.4em;flex:1;min-height:0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:1.6em;padding:2.6em 2.6em 2.2em;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero h1{font-size:6.6em;line-height:.9;font-weight:500;letter-spacing:-.035em;margin:0}
.hero .lede{font-size:1.55em;line-height:1.35;font-weight:400;margin:.9em 0 0;max-width:15em}
.hero .lanes{position:absolute;right:-2em;bottom:-1em;width:62%;opacity:.9;pointer-events:none}
.chips{display:flex;gap:.6em;flex-wrap:wrap;position:relative}
.chip{display:flex;align-items:center;gap:.5em;font-weight:500;font-size:1.05em;padding:.5em .95em .5em .5em;border-radius:2em;background:#FFFFFF;color:#3C3C3C}
.chip i{width:1.25em;height:1.25em;border-radius:50%;display:block}
.form{background:var(--surface);border-radius:1.6em;padding:2.4em;display:flex;flex-direction:column;justify-content:center}
.form h2{font-size:2em;font-weight:500;letter-spacing:-.02em;margin:0 0 .3em}
.form .sub{color:var(--muted);font-size:1.15em;margin:0 0 1.6em;line-height:1.4}
.form label{display:block;font-weight:500;font-size:1.1em;margin-bottom:.5em}
.form input{width:100%;font-size:1.5em;padding:.65em .8em;border-radius:.6em;border:2px solid var(--line);background:var(--surface-2);outline:none;user-select:text;-webkit-user-select:text}
.form input:focus{border-color:var(--blue);background:var(--surface)}
.err{color:var(--bad);min-height:1.4em;margin:.5em 0 0;font-weight:500}
.consent{font-size:.92em;color:var(--muted);line-height:1.45;margin:.3em 0 1.6em}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:500;font-size:1.45em;padding:.8em 1.8em;cursor:pointer;min-height:2.9em;letter-spacing:-.01em}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Play */
.play{position:absolute;inset:0;display:none;font-size:1.6cqw;user-select:none;-webkit-user-select:none}
.play.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;top:1.3em;left:1.4em;right:1.4em;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none;color:#3C3C3C}
.pill{background:rgba(255,255,255,.94);border-radius:999px;padding:.5em 1.1em;box-shadow:0 .3em 1.2em rgba(75,100,120,.18)}
.hscore{justify-self:start;display:flex;align-items:baseline;gap:.55em}
.hscore small{font-size:.95em;font-weight:500;color:#46505A}
.hscore b{font-size:2em;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hscore span{font-weight:600;font-size:1.05em;background:#00D7D2;color:#3C3C3C;border-radius:999px;padding:.12em .5em}
.htime{font-size:2.4em;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;min-width:2.6em;padding:.25em .6em;letter-spacing:-.02em}
.htime.low{color:#BF2E2E}
.hfuel{justify-self:end;display:flex;align-items:center;gap:.7em;font-weight:500;padding:.75em 1.1em}
.hfuel i{display:block;width:9em;height:.75em;background:#E3E3E3;border-radius:999px;overflow:hidden}
.hfuel b{display:block;height:100%;background:linear-gradient(90deg,#00D7D2,#AAFFD2);border-radius:999px;transition:width .15s}
.hfuel.low b{background:#BF2E2E;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.35}}
.pbar{position:absolute;top:5.9em;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:.7em;font-weight:600;border-radius:999px;padding:.45em 1em}
.pbar.on{display:flex}
.pbar i{display:block;width:7em;height:.5em;background:rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.pbar i b{display:block;height:100%;background:currentColor}
.ptoast{position:absolute;left:50%;top:9.4em;transform:translate(-50%,-.6em) scale(.94);opacity:0;transition:all .22s;text-align:left;padding:.9em 1.4em;border-radius:1.1em;pointer-events:none;max-width:72%;display:flex;gap:.9em;align-items:center;box-shadow:0 .5em 1.6em rgba(60,60,60,.2)}
.ptoast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.ptoast b{display:block;font-size:1.55em;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ptoast span{font-size:1.1em;font-weight:400}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#3C3C3C;gap:.8em}
.overlay .big{font-size:6.5em;font-weight:600;letter-spacing:-.04em;line-height:1;background:#FFFFFF;border-radius:999px;min-width:1.6em;padding:.12em .4em;text-align:center;box-shadow:0 .1em .4em rgba(75,100,120,.25)}
.overlay .hint{font-size:1.5em;font-weight:500;background:#FFFFFF;padding:.55em 1.1em;border-radius:999px;box-shadow:0 .2em .8em rgba(75,100,120,.2)}

/* Result */
.result{flex:1;display:grid;grid-template-columns:1fr 1.15fr;gap:1.4em;min-height:0}
.scorecard{background:var(--hero);color:var(--hero-ink);border-radius:1.6em;padding:2.4em;display:flex;flex-direction:column;justify-content:space-between}
.scorecard .lbl{font-size:1.2em;font-weight:500}
.score{font-size:8.5em;font-weight:500;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;margin-top:.1em}
.rank{font-size:1.6em;font-weight:500;margin-top:.5em}
.pnum{font-size:1.2em;margin-top:.4em}
.pnum b{font-weight:600}
.board{list-style:none;padding:.6em;margin:1.2em 0 0;font-size:1.1em;background:rgba(255,255,255,.55);border-radius:1em}
.board li{display:flex;justify-content:space-between;padding:.4em .8em;border-radius:.6em;font-variant-numeric:tabular-nums}
.board li.me{background:#FFFFFF;font-weight:600}
.side{display:flex;flex-direction:column;gap:1em;min-height:0}

/* ================= Storage ================= */

  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return k in mem ? mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { mem[k] = v; } }
};
const RKEY = "fr_records";
const records = () => store.get(RKEY, []);
function saveRecord(rec) {
  if (!rec || rec.preview) return;
  const all = records(); const i = all.findIndex(r => r.id === rec.id);
  if (i >= 0) all[i] = rec; else all.push(rec);
  store.set(RKEY, all);
}
function newPlayerNumber(tablet) {
  const [lo, hi] = CONFIG.ranges[tablet], key = "fr_used_" + tablet, used = new Set(store.get(key, []));
  if (used.size >= hi - lo + 1) return null;
  let n; do { n = lo + Math.floor(Math.random() * (hi - lo + 1)); } while (used.has(n));
  used.add(n); store.set(key, [...used]); return n;
}

/* ================= Game engine ================= */
const cv = $("#cv"), ctx = cv.getContext("2d");
let W = 800, H = 600, K = 720, HOR = 180, DPR = 1;
const CAMH = 1.4, PZ = 3, NEAR = 0.9, FAR = 60, LANE = 0.9;
const laneX = l => (l - 1) * LANE;
const FACADES = ["#C8DCEB", "#B9C8CD", "#96BED2", "#4B6478", "#46505A", "#E3E3E3", "#C8DCEB", "#96BED2"];
const hash = i => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };
let G = null, raf = 0, lastT = 0;

function resize() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR;
  K = 1.2 * H; HOR = 0.3 * H;
  if (typeof redrawFrozen === "function") redrawFrozen();
}
new ResizeObserver(resize).observe(cv);

function proj(x, y, z) { const s = K / z; return [W / 2 + (x - G.camX) * s, HOR + (CAMH - y) * s, s]; }
function quad(pts, fill) {
  ctx.beginPath();
  pts.forEach((p, i) => { const q = proj(p[0], p[1], p[2]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = c => Math.max(0, Math.min(255, Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f)))); return `rgb(${m(r)},${m(g)},${m(b)})`; }
function lum(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11) / 255; }

function newGame() {
  return {
    state: "ready", t: 0, readyT: 3, overT: 0, clock: 0,
    dist: 0, speed: 0, camX: 0, lane: 1, px: 0, tilt: 0, jy: 0, jv: 0,
    fuel: 100, score: 0, combo: 0, mult: 1,
    conn: 0, opt: 0, pay: 0, inv: 0, slow: 1, shake: 0,
    objs: [], nextZ: 26, puQ: CONFIG.powerups.map(p => ({ ...p })),
    fx: [], texts: [],
    clouds: Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: 0.05 + Math.random() * 0.16, s: 0.6 + Math.random() * 0.8 })),
    stats: { pay: 0, conn: 0, opt: 0, idle: 0, dodged: 0, coins: 0, crashes: 0 }
  };
}

function spawnRow(z) {
  const t = G.t;
  const nBlock = t < 5 ? 1 : (Math.random() < 0.4 ? 2 : 1);
  const lanes = shuffle([0, 1, 2]), blocked = lanes.slice(0, nBlock), free = lanes.slice(nBlock);
  blocked.forEach(l => {
    const type = Math.random() < 0.55 ? "idle" : "cone";
    G.objs.push({ type, lane: l, x: laneX(l), z, alive: true, ph: Math.random() });
    if (type === "cone" && Math.random() < 0.6) [[-1, 0.8], [0, 1.05], [1, 0.8]].forEach(([dz, h]) => G.objs.push({ type: "coin", lane: l, x: laneX(l), z: z + dz * 0.9, h, alive: true, ph: Math.random() * 6 }));
  });
  if (G.puQ.length && t >= G.puQ[0].t) {
    const p = G.puQ.shift();
    G.objs.push({ type: "pu", pu: p.type, lane: free[0], x: laneX(free[0]), z, alive: true });
  } else {
    const l = free[Math.floor(Math.random() * free.length)];
    for (let i = 0; i < 4; i++) G.objs.push({ type: "coin", lane: l, x: laneX(l), z: z + 1.3 + i * 1.0, h: 0.38, alive: true, ph: Math.random() * 6 });
  }
}

function floatText(text, x, y, color) { if (G.demo) return; const dup = G.texts.find(q => q.text === text && q.t < 0.8); if (dup) { dup.n = (dup.n || 1) + 1; dup.t = 0; return; } G.texts.push({ text, x, y: y - Math.min(G.texts.length, 2) * H * 0.065, t: 0, color }); }
function burst(x, y, color, n = 10) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 180; G.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0, color, r: 3 + Math.random() * 4 }); } }
let toastT = 0;
function toast(type) { if (settings.pickups !== "short") return showPop(type);
  const c = CAPS[type], el = $("#ptoast");
  el.style.background = c.color; el.style.color = c.fg;
  el.innerHTML = `<div><b>${c.name}</b><span>${c.short || c.toast}</span></div>`;
  el.classList.add("show"); toastT = 2;
}

function steer(d) { if (!G || G.demo || G.state === "over" || G.opt > 0 || G.hold > 0) return; G.lane = Math.max(0, Math.min(2, G.lane + d)); }
function jump() { if (!G || G.demo || G.state === "over" || G.jy > 0.01 || G.hold > 0) return; G.jv = 3.7; }

function update(dt) {
  G.clock += dt;
  if (G.state === "ready") { G.readyT -= dt; if (G.readyT <= 0) G.state = "run"; }
  if (G.state === "over") { G.overT += dt; if (G.overT > 1.4) { finishGame(); return; } }
  const running = G.state === "run";
  if (running) {
    G.t += dt;
    if (G.demo) { G.t = 10; G.fuel = 100; demoPowerups(); }
    G.slow = Math.min(1, G.slow + dt * 0.45);
    const base = 12.5 + G.t * 0.28;
    G.speed = base * (G.fuel <= 0 ? 0.6 : 1) * (G.opt > 0 ? 1.25 : 1) * G.slow;
    G.dist += G.speed * dt;
    G.score += G.speed * dt;
    G.fuel = Math.max(0, G.fuel - 4.4 * dt);
    G.conn = Math.max(0, G.conn - dt); G.opt = Math.max(0, G.opt - dt); G.pay = Math.max(0, G.pay - dt); G.inv = Math.max(0, G.inv - dt);
    G.optT = (G.optT || 0) + dt; G.scanT = (G.scanT == null ? 9 : G.scanT) + dt;
    while (G.nextZ < G.dist + 46) { spawnRow(G.nextZ); G.nextZ += (G.t < 10 ? 7 : 5.6) + Math.random() * 2; }
    if (G.t >= CONFIG.seconds) { G.state = "over"; showOverlay("Time’s up!", ""); }
  }
  G.clouds.forEach(c => { c.x -= dt * 0.006 * c.s; if (c.x < -0.2) c.x = 1.2; });
  { const tgt = G.conn > 0.35 ? 1 : 0, ck = G.connK || 0; G.connK = ck + Math.max(-dt * 2.6, Math.min(dt * 3.2, tgt - ck)); }
  if (G.fuelD == null || G.fuel < G.fuelD) G.fuelD = G.fuel; else G.fuelD += (G.fuel - G.fuelD) * Math.min(1, dt * 7);

  if (G.demo && running && G.opt <= 0) autopilot();
  if (G.opt > 0) {
    let best = G.lane, bestClear = -1;
    [G.lane, 0, 1, 2].forEach(l => {
      let clear = 99;
      G.objs.forEach(o => { if (o.alive && (o.type === "idle" && !o.alerted || o.type === "cone") && o.lane === l) { const rz = o.z - G.dist; if (rz > PZ - 0.3 && rz < PZ + 16) clear = Math.min(clear, rz); } });
      if (clear > bestClear + 0.01) { bestClear = clear; best = l; }
    });
    G.lane = best;
  }
  if (G.opt > 0 && settings.pickups !== "short") { G.route = planRoute(); const r = G.route.find(p => p.z >= PZ + 1.5); if (r) G.lane = r.lane; } else G.route = null;
  const tx = laneX(G.lane);
  G.tilt = (tx - G.px) * -0.5;
  G.px += (tx - G.px) * Math.min(1, dt * 14);
  if (G.jv || G.jy > 0) { G.jy += G.jv * dt; G.jv -= 12 * dt; if (G.jy <= 0) { G.jy = 0; G.jv = 0; } }
  G.camX += (G.px * (G.demo ? 1 : 0.55) - G.camX) * Math.min(1, dt * 6);

  for (const o of G.objs) {
    if (!o.alive) continue;
    const rz = o.z - G.dist;
    if (o.type === "idle") {
      connAlert(o, rz);
      if (o.alerted) { o.at += dt; const side = o.lane === 0 ? -1 : 1; o.x += (side * 1.85 - o.x) * Math.min(1, dt * 3); }
    }
    if (o.type === "coin" && G.pay > 0 && rz < PZ + 12 && rz > PZ - 0.5) { const k = Math.min(1, dt * 9); o.x += (G.px - o.x) * k; o.h += ((G.jy + 0.4) - (o.h || 0.38)) * k; o.pulled = true; }
    if (running && o.type === "cone" && !o.cleared && Math.abs(rz - PZ) < 0.4 && Math.abs(o.x - G.px) < 0.45 && G.jy >= 0.32) {
      o.cleared = true; G.score += 25; const q = proj(o.x, 0.9, PZ); floatText("+25 Nice jump", q[0], q[1], "#3C3C3C");
    }
    const hitY = o.type === "coin" ? Math.abs((o.h || 0.38) - (G.jy + 0.4)) < 0.45 : o.type === "cone" ? G.jy < 0.32 : o.type === "pu" ? G.jy < 0.95 : true;
    if (running && hitY && Math.abs(rz - PZ) < 0.4 && Math.abs(o.x - G.px) < 0.45) {
      const p = proj(o.x, 0.5, PZ);
      if (o.type === "coin") {
        o.alive = false; G.combo++; G.stats.coins++;
        G.mult = Math.min(5, 1 + Math.floor(G.combo / 8));
        G.score += 10 * G.mult; burst(p[0], p[1], "#00D7D2", 7); if (o.pulled) G.stats.magnet = (G.stats.magnet || 0) + 1;
      } else if (o.type === "pu") {
        o.alive = false; G.score += 100; burst(p[0], p[1], CAPS[o.pu].glow, 20); burst(p[0], p[1], "#FFFFFF", 8); toast(o.pu);
        if (o.pu === "pay") { G.fuel = 100; G.pay = 4; G.stats.pay++; floatText("Full tank. Coin magnet on!", p[0], p[1] - 40, "#AAFFD2"); }
        if (o.pu === "conn") { G.conn = 6; G.scanT = 0; G.stats.conn++; }
        if (o.pu === "opt") { G.opt = 5; G.optT = 0; G.stats.opt++; }
      } else if ((o.type === "cone" || (o.type === "idle" && !o.alerted)) && G.inv <= 0 && G.opt <= 0) {
        o.alive = false; G.fuel = Math.max(0, G.fuel - 12); G.slow = 0.45; G.inv = 1.2; G.combo = 0; G.mult = 1; G.shake = 0.35; G.stats.crashes++;
        burst(p[0], p[1], "#B9C8CD", 16); floatText(o.type === "idle" ? "Idling van! Fuel wasted" : "Ouch!", p[0], p[1] - 30, "#BF2E2E");
      }
    }
    if (running && G.opt > 0 && !o.counted && (o.type === "cone" || (o.type === "idle" && !o.alerted)) && rz < PZ - 0.5) { o.counted = true; G.stats.dodged++; }
    if (rz < 0.5) o.alive = false;
  }
  G.objs = G.objs.filter(o => o.alive);
  G.fx.forEach(f => { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 400 * dt; });
  G.fx = G.fx.filter(f => f.t < 0.7);
  G.texts.forEach(t => t.t += dt); G.texts = G.texts.filter(t => t.t < 1.1);
  G.shake = Math.max(0, G.shake - dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $("#ptoast").classList.remove("show"); }
  if (G.state === "ready") showOverlay(G.readyT > 0.6 ? Math.ceil(G.readyT - 0.6) : "Go!", HOW_HINT);
  else if (G.state === "run") showOverlay("", G.t < 4 ? HOW_HINT : "");
}

let ovKey = "";
function showOverlay(big, hint) {
  const key = big + "|" + hint; if (key === ovKey) return; ovKey = key;
  $("#ov").innerHTML = (big !== "" ? `<div class="big">${big}</div>` : "") + (hint ? `<div class="hint">${hint}</div>` : "");
}

/* ---------- Drawing ---------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HOR);
  g.addColorStop(0, "#05AFDC"); g.addColorStop(0.55, "#62D0EA"); g.addColorStop(1, "#BEFFFA");
  ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, HOR + 30);
  // soft clouds
  G.clouds.forEach(c => {
    const x = c.x * W, y = c.y * H, s = c.s * H * 0.05;
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(x, y, s * 2.2, s * 0.6, 0, 0, 7); ctx.ellipse(x + s * 1.2, y - s * 0.3, s * 1.3, s * 0.6, 0, 0, 7); ctx.ellipse(x - s * 1.1, y - s * 0.2, s, s * 0.45, 0, 0, 7); ctx.fill();
  });
  // two skyline layers
  const layers = [["rgba(200,220,235,.95)", 0.34, 8, 31], ["rgba(150,190,210,.75)", 0.22, 14, 57]];
  layers.forEach(([col, hmax, par, seed]) => {
    ctx.fillStyle = col;
    const w = W / 18;
    for (let i = -2; i < 22; i++) {
      const h = (0.25 + hash(i + seed) * 0.75) * HOR * hmax, x = i * w - (G.camX * par) % w - w;
      rr(x, HOR - h, w * 0.86, h + 2, w * 0.08); ctx.fill();
    }
  });
}

function drawScene() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); PU_LABELS.length = 0; WARN.length = 0;
  const sh = G.shake > 0 ? (Math.random() - 0.5) * 14 * G.shake / 0.35 : 0;
  ctx.translate(sh, sh * 0.5);
  drawSky();
  ctx.fillStyle = "#E3E3E3"; ctx.fillRect(-30, HOR, W + 60, H - HOR + 30);
  // sidewalks, curb and road
  quad([[-2.15, 0, FAR], [2.15, 0, FAR], [2.15, 0, NEAR], [-2.15, 0, NEAR]], "#F5F5F5");
  [-1, 1].forEach(s => quad([[s * 1.6, 0, FAR], [s * 1.72, 0, FAR], [s * 1.72, 0, NEAR], [s * 1.6, 0, NEAR]], "#B9C8CD"));
  const rg = ctx.createLinearGradient(0, HOR, 0, H);
  rg.addColorStop(0, "#8796A5"); rg.addColorStop(0.18, "#5A6573"); rg.addColorStop(1, "#3C3C3C");
  quad([[-1.6, 0, FAR], [1.6, 0, FAR], [1.6, 0, NEAR], [-1.6, 0, NEAR]], rg);
  if (G.opt > 0 && settings.pickups === "short") {
    const lx = G.px, a = 0.25 + 0.1 * Math.sin(G.clock * 8);
    quad([[lx - 0.4, 0, PZ + 24], [lx + 0.4, 0, PZ + 24], [lx + 0.4, 0, PZ - 0.5], [lx - 0.4, 0, PZ - 0.5]], `rgba(150,190,210,${a})`);
    const seg = 1.2, off = G.dist % seg;
    for (let n = 0; n < 18; n++) { const z1 = PZ + n * seg - off + 0.6; quad([[lx - 0.05, 0, z1], [lx + 0.05, 0, z1], [lx + 0.05, 0, z1 + 0.5], [lx - 0.05, 0, z1 + 0.5]], "#BEFFFA"); }
  }
  // brand edge lines with glow
  ctx.save(); ctx.shadowColor = "#00D7D2"; ctx.shadowBlur = 12;
  [-1.45, 1.45].forEach(x => quad([[x - 0.035, 0, FAR], [x + 0.035, 0, FAR], [x + 0.035, 0, NEAR], [x - 0.035, 0, NEAR]], "#00D7D2"));
  ctx.restore();
  const seg = 3.2, off = G.dist % seg;
  for (let n = 0; n < 20; n++) {
    const z1 = n * seg - off + 0.4, z2 = z1 + 1.5; if (z2 < NEAR) continue;
    [-LANE / 2, LANE / 2].forEach(x => quad([[x - 0.03, 0, Math.max(z1, NEAR)], [x + 0.03, 0, Math.max(z1, NEAR)], [x + 0.03, 0, z2], [x - 0.03, 0, z2]], "rgba(245,245,245,.9)"));
  }
  if (G.opt > 0 && settings.pickups !== "short") drawRoute();
  drawBuildings();
  // horizon haze for depth
  const vx = W / 2 - G.camX * K / FAR, hz = ctx.createRadialGradient(vx, HOR, 0, vx, HOR, W * 0.22);
  hz.addColorStop(0, "rgba(190,255,250,.85)"); hz.addColorStop(0.5, "rgba(190,255,250,.35)"); hz.addColorStop(1, "rgba(190,255,250,0)");
  ctx.fillStyle = hz; ctx.save(); if (G.conn > 0 && settings.pickups !== "short") ctx.globalAlpha = 0.35; ctx.translate(vx, HOR); ctx.scale(1, 0.32); ctx.translate(-vx, -HOR); ctx.fillRect(vx - W * 0.25, HOR - W * 0.25, W * 0.5, W * 0.5); ctx.restore();

  drawFog();
  if (settings.logo === "gantry") drawGantries();
  if (settings.logo === "blimp") drawBlimp();
  const objs = G.objs.map(o => ({ o, rz: o.z - G.dist })).filter(a => a.rz > 1.5 && a.rz < 50).sort((a, b) => b.rz - a.rz);
  objs.filter(a => a.rz >= PZ).forEach(a => drawObj(a.o, a.rz));
  drawPlayer();
  objs.filter(a => a.rz < PZ).forEach(a => drawObj(a.o, a.rz));
  drawPuLabels(); drawWarnings(); drawRoutePin();
  G.fx.forEach(f => { ctx.globalAlpha = Math.max(0, 1 - f.t / 0.7); ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  G.texts.forEach(drawTextPill);
  ctx.globalAlpha = 1;
}

function drawBuildings() {
  const i0 = Math.floor(G.dist / 3.6);
  for (let i = i0 + 17; i >= i0; i--) {
    for (const side of [-1, 1]) {
      const z1 = i * 3.6 - G.dist, z2 = z1 + 3.0; if (z2 < NEAR) continue;
      const nz1 = Math.max(z1, NEAR), h = 1.8 + hash(i * 7 + side * 3) * 3.4, col = FACADES[Math.floor(hash(i * 3 + side) * FACADES.length)];
      const x = side * 2.2, xo = side * 6.5, dark = lum(col) < 0.5;
      const fog = Math.max(0, Math.min(1, (z2 - 20) / 34));
      // front face (faces the camera)
      if (z1 >= NEAR) {
        quad([[x, 0, z1], [xo, 0, z1], [xo, h, z1], [x, h, z1]], shade(col, 0.22));
        if (hash(i * 11 + side) > 0.93 && z1 > 4 && z1 < 30) drawBillboard(x, xo, h, z1, side);
      }
      // facade along the road, with a subtle vertical gradient
      const a = proj(x, h, nz1), b = proj(x, 0, nz1);
      const fg = ctx.createLinearGradient(0, a[1], 0, b[1]);
      fg.addColorStop(0, shade(col, 0.08)); fg.addColorStop(1, shade(col, -0.14));
      quad([[x, 0, nz1], [x, 0, z2], [x, h, z2], [x, h, nz1]], fg);
      // glass bands
      if (z2 - 0.25 > nz1 + 0.25) {
        const glass = dark ? "rgba(190,255,250,.32)" : "rgba(75,100,120,.28)";
        for (let f = 0.5; f < h - 0.35; f += 0.62) quad([[x, f, nz1 + 0.22], [x, f, z2 - 0.22], [x, f + 0.34, z2 - 0.22], [x, f + 0.34, nz1 + 0.22]], glass);
        // vertical mullions
        for (let m = nz1 + 0.75; m < z2 - 0.3; m += 0.75) quad([[x, 0.45, m], [x, 0.45, m + 0.05], [x, h - 0.3, m + 0.05], [x, h - 0.3, m]], dark ? "rgba(255,255,255,.08)" : "rgba(255,255,255,.35)");
      }
      if (settings.logo === "wall") wallLogo(i, side, x, z1, z2, h);
      // roof cap
      quad([[x, h, nz1], [x, h, z2], [x, h + 0.08, z2], [x, h + 0.08, nz1]], shade(col, -0.25));
      if (fog > 0) quad([[x, 0, nz1], [x, 0, z2], [x, h + 0.08, z2], [x, h + 0.08, nz1]], `rgba(200,220,235,${fog * 0.85})`);
    }
    // street lamps
    for (const side of [-1, 1]) {
      const lz = i * 3.6 + 1.8 - G.dist; if (lz < NEAR + 0.5 || lz > 40) continue;
      const [bx, by, s] = proj(side * 1.9, 0, lz), [tx, ty] = proj(side * 1.9, 1.5, lz), [hx, hy] = proj(side * 1.65, 1.5, lz);
      ctx.strokeStyle = "#46505A"; ctx.lineWidth = Math.max(1, s * 0.035); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = "#AAFFD2"; ctx.beginPath(); ctx.ellipse(hx, hy + s * 0.02, s * 0.08, s * 0.03, 0, 0, 7); ctx.fill();
    }
  }
}
function drawBillboard(x, xo, h, z, side) {
  const p1 = proj(x + side * 0.4, h * 0.97, z), p2 = proj(xo - side * 0.6, h * 0.57, z);
  const left = Math.min(p1[0], p2[0]), right = Math.max(p1[0], p2[0]), top = p1[1], bot = p2[1];
  const w = right - left, hh = bot - top; if (w < 50 || hh < 18) return;
  ctx.fillStyle = "#FFFFFF"; rr(left, top, w, hh, Math.min(10, hh * 0.18)); ctx.fill();
  if (IMG.lockup.complete && IMG.lockup.naturalWidth) {
    const iw = Math.min(w * 0.86, hh * 0.74 * (IMG.lockup.naturalWidth / IMG.lockup.naturalHeight)), ih = iw * IMG.lockup.naturalHeight / IMG.lockup.naturalWidth;
    ctx.drawImage(IMG.lockup, left + (w - iw) / 2, top + (hh - ih) / 2, iw, ih);
  }
}

/* normal sight ends ~30 ahead; Element Connect lifts the fog and shows the whole road */
function fade(rz) { const k = G ? (G.connK || 0) : 0, far = 32 + 16 * k; return Math.max(0, Math.min(1, (far - rz) / 6)); }
function drawObj(o, rz) {
  const [sx, sy, s] = proj(o.x, 0, rz);
  ctx.globalAlpha = fade(rz);
  const shw = o.type === "coin" ? 0.1 : o.type === "pu" ? 0.22 : 0.36;
  ctx.fillStyle = "rgba(20,30,40,.22)"; ctx.beginPath(); ctx.ellipse(sx, sy, shw * s, 0.05 * s, 0, 0, 7); ctx.fill();
  if (o.type === "coin") {
    const r = 0.16 * s, y = sy - (o.h || 0.38) * s, sp = Math.abs(Math.cos(G.clock * 4 + o.ph));
    ctx.save(); ctx.translate(sx, y); ctx.scale(Math.max(0.12, sp), 1);
    const g = ctx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, "#AAFFD2"); g.addColorStop(1, "#00D7D2");
    ctx.fillStyle = "#05AFDC"; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, 7); ctx.fill();
    if (sp > 0.35) { ctx.fillStyle = "#3C3C3C"; ctx.font = `600 ${r * 1.15}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("$", 0, r * 0.06); }
    ctx.restore();
  } else if (o.type === "cone") {
    const w = 0.3 * s, h = 0.4 * s;
    ctx.fillStyle = "#3C3C3C"; rr(sx - w * 0.68, sy - h * 0.09, w * 1.36, h * 0.09, h * 0.03); ctx.fill();

function autopilot() {
  const look = l => {
    let block = 99, cone = false, gain = 0;
    for (const o of G.objs) {
      if (!o.alive || o.lane !== l) continue;
      const d = o.z - G.dist - PZ;
      if (d < -0.3 || d > 18) continue;
      if (o.type === "cone" || (o.type === "idle" && !o.alerted)) { if (d < block) { block = d; cone = o.type === "cone"; } }
      else if (o.type === "pu") gain += 8;
      else if (o.type === "coin" && d < 10) gain += 0.5;
    }
    return { block, cone, v: Math.min(block, 12) + gain };
  };
  const L = [0, 1, 2].map(look), cur = L[G.lane];
  if (G.clock > (G.apT || 0)) {
    let best = G.lane;
    [G.lane - 1, G.lane + 1].forEach(l => { if (l >= 0 && l <= 2 && L[l].v > L[best].v + 1 && L[l].block > 1.2) best = l; });
    if (best !== G.lane) { G.lane = best; G.apT = G.clock + 0.3; return; }
  }
  if (cur.cone && cur.block < 1.4 && cur.block > 0.2 && G.jy <= 0.01) G.jv = 3.7;
}

/* Round 13: the optimal route reads like a navigation app: road dims, the route draws itself in, ends at a "Best route" pin */
function drawRoute() {
  const pts = G.route; if (!pts || pts.length < 2) return;
  const a = Math.min(1, G.opt / 0.5), reach = PZ + Math.min(20, 1 + (G.optT || 0) * 36);
  const vis = pts.filter(p => p.z >= NEAR + 0.25 && p.z <= reach);
  if (vis.length < 2) return;
  ctx.save();
  // dim the rest of the road so the route is what lights up
  ctx.globalAlpha = a; quad([[-1.6, 0, FAR], [1.6, 0, FAR], [1.6, 0, NEAR], [-1.6, 0, NEAR]], "rgba(15,25,35,.32)");
  const ribbon = (hw, fill) => {
    ctx.fillStyle = fill; ctx.beginPath();
    vis.forEach((p, i) => { const q = proj(p.x - hw, 0.005, p.z); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    for (let i = vis.length - 1; i >= 0; i--) { const q = proj(vis[i].x + hw, 0.005, vis[i].z); ctx.lineTo(q[0], q[1]); }
    ctx.closePath(); ctx.fill();
  };
  ctx.globalAlpha = a * 0.45; ctx.shadowColor = "#00D7D2"; ctx.shadowBlur = 26; ribbon(0.36, "#00D7D2");
  ctx.shadowBlur = 0; ctx.globalAlpha = a; ribbon(0.25, "#FFFFFF");
  const yNear = proj(0, 0, vis[0].z)[1], yFar = proj(0, 0, vis[vis.length - 1].z)[1];
  const g = ctx.createLinearGradient(0, yFar, 0, yNear); g.addColorStop(0, "#05AFDC"); g.addColorStop(1, "#00D7D2");
  ribbon(0.18, g);
  // arrows flowing forward inside the line
  const xAt = z => { const i = Math.min(pts.length - 2, Math.max(0, Math.floor((z - pts[0].z) / 0.5))), t = (z - pts[i].z) / 0.5; return pts[i].x + (pts[i + 1].x - pts[i].x) * t; };
  ctx.strokeStyle = "#FFFFFF"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const off = (G.clock * 3) % 1.6;
  for (let z = PZ + 0.4 + off; z < reach - 0.8; z += 1.6) {
    const x = xAt(z), L = proj(x - 0.1, 0.01, z), A = proj(x, 0.01, z + 0.22), R = proj(x + 0.1, 0.01, z);
    ctx.globalAlpha = a; ctx.lineWidth = Math.max(2, L[2] * 0.045);
    ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.lineTo(A[0], A[1]); ctx.lineTo(R[0], R[1]); ctx.stroke();
  }
  const e = vis[vis.length - 1]; G.pin = { x: e.x, z: e.z, a };
  ctx.restore();
}

/* destination pin + label, drawn on top of buildings and fog */
function drawRoutePin() {
  const pin = G.pin; G.pin = null; if (!pin || G.opt <= 0) return;
  const [px, py, ps] = proj(pin.x, 0, pin.z), pr = Math.max(H * 0.02, ps * 0.16);
  ctx.save(); ctx.globalAlpha = pin.a;
  ctx.shadowColor = "rgba(0,215,210,.8)"; ctx.shadowBlur = 16;
  ctx.fillStyle = "#00D7D2"; ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = Math.max(2, pr * 0.22);
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - pr * 0.82, py - pr * 1.55); ctx.arc(px, py - pr * 2.05, pr, Math.PI * 0.84, Math.PI * 2.16); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
  ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(px, py - pr * 2.05, pr * 0.38, 0, 7); ctx.fill();
  const fs = Math.max(13, H * 0.03); ctx.font = `600 ${fs}px ${FONT}`;
  const tw = ctx.measureText("Best route").width + fs * 1.3, ph = fs * 1.75, ly = py - pr * 3.4;
  ctx.fillStyle = "#3C3C3C"; rr(px - tw / 2, ly - ph, tw, ph, ph / 2); ctx.fill();
  ctx.fillStyle = "#FFFFFF"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Best route", px, ly - ph / 2 + fs * 0.06);
  ctx.restore();
}

/* Round 13: distance fog. Normal view ends ~30 ahead; Element Connect lifts it, and a scan line sweeps the road on pickup */
function drawFog() {
  const k = G.connK || 0, yA = HOR, yB = proj(0, 0, 17)[1];
  if (k < 1) {
    const g = ctx.createLinearGradient(0, yA, 0, yB);
    g.addColorStop(0, `rgba(214,232,240,${0.85 * (1 - k)})`); g.addColorStop(0.5, `rgba(214,232,240,${0.5 * (1 - k)})`); g.addColorStop(1, "rgba(214,232,240,0)");
    quad([[-2.2, 0, FAR], [2.2, 0, FAR], [2.2, 0, 17], [-2.2, 0, 17]], g);
  }
  if (G.scanT < 0.9) {
    const t = G.scanT / 0.9, z = PZ + 1 + t * 44, al = 0.85 * (1 - t);
    ctx.save(); ctx.shadowColor = "#05AFDC"; ctx.shadowBlur = 18;
    quad([[-2.15, 0.01, z], [2.15, 0.01, z], [2.15, 0.01, z + 0.35 + t * 1.2], [-2.15, 0.01, z + 0.35 + t * 1.2]], `rgba(5,175,220,${al})`);
    ctx.restore();
  }
}

function exportCsv() {
  const safe = v => { v = String(v == null ? "" : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const rows = [["player", "email", "score", "element_pay", "element_connect", "route_optimization", "started", "completed", "tablet", "status"]]
    .concat(records().map(r => [r.playerNo, r.email, r.score, r.stats ? r.stats.pay || 0 : "", r.stats ? r.stats.conn || 0 : "", r.stats ? r.stats.opt || 0 : "", r.startedAt || "", r.completedAt || "", r.tablet, r.status]));
  const csv = rows.map(r => r.map(safe).join(",")).join("\n"), name = `fleet-rush-tablet-${settings.tablet}-${new Date().toISOString().slice(0, 10)}.csv`;
  try {
    const file = typeof File === "function" ? new File([csv], name, { type: "text/csv" }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name })
        .then(() => { $("#smsg").textContent = "CSV shared. Choose Save to Files, AirDrop or Mail in the sheet."; })
        .catch(e => { if (e && e.name !== "AbortError") $("#smsg").textContent = "Couldn’t open the share sheet. Try again."; });
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    $("#smsg").textContent = "CSV file created. On the iPad it goes to Files, in Downloads.";
  } catch (err) { $("#smsg").textContent = "This page can’t save files here."; }
}

function board(p) {
  const today = new Date().toDateString();
  let all = records().filter(r => r.tablet === settings.tablet && r.status === "completed" && new Date(r.completedAt).toDateString() === today);
  if (p.preview) all = all.concat([p]);
  all.sort((a, b) => b.score - a.score);
  return { list: all.slice(0, 5), rank: all.findIndex(r => r.id === p.id) + 1, total: all.length };
}
function showResultOld() {
  stopGame(); uiEl.className = "ui"; onWelcome = false;
  if (!player) { player = previewPlayer(); player.score = 1840; player.stats = { pay: 2, idle: 4, dodged: 6, coins: 41, crashes: 1 }; player.status = "completed"; player.completedAt = new Date().toISOString(); }
  const b = board(player), st = player.stats || { pay: 0, idle: 0, dodged: 0 };
  const recap = [["pay", st.pay], ["conn", st.idle], ["opt", st.dodged]].map(([k, n]) =>
    `<li><span class="n" style="background:${CAPS[k].color};color:${CAPS[k].fg}"><b>${n}</b></span><div><strong>${CAPS[k].name}: ${CAPS[k].recap(n)}</strong><span>${CAPS[k].msg}</span></div></li>`).join("");
  screen.innerHTML = `
    <div class="result">
      <div class="scorecard">
        <div>
          <div class="lbl">Your score</div>
          <div class="score">${player.score.toLocaleString()}</div>
          <div class="rank">${b.rank === 1 ? "Top score today!" : `#${b.rank} of ${b.total} today`}</div>
          <div class="pnum">Player number <b>#${player.playerNo}</b></div>

        <ul class="board">${b.list.map((r, i) => `<li class="${r.id === player.id ? "me" : ""}"><span>${i + 1}. Player #${r.playerNo}</span><span>${r.score.toLocaleString()}</span></li>`).join("")}</ul>
      </div>
      <div class="side">
        <ul class="recap">${recap}</ul>

      </div>
    </div>`;
  $("#np").onclick = showWelcome;
}

function openStaff(msg = "") {
  if (G) { settings.paused = true; $("#pause").checked = true; }
  const all = records(), pending = all.filter(r => r.sync !== "synced").length;
  const fmt = t => t ? new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
  const res = r => r.stats ? `Pay ${r.stats.pay || 0}, Connect ${r.stats.conn || 0}, Route ${r.stats.opt || 0}` : "";
  staff.innerHTML = `
    <h3>Staff view</h3>
    <div class="meta">Tablet ${settings.tablet}. ${all.length} records on this device, ${pending} waiting to sync.</div>
    <div class="actions"><button id="sync">Sync now</button><button id="exp">Export CSV</button><button id="clr">Clear prototype data</button><button id="cls">Close</button><label class="tabsel">Tablet <select id="stab"><option value="A">A (1000–4999)</option><option value="B">B (5000–9999)</option></select></label><button id="rev">Show review bar</button></div>
    <div class="msg" id="smsg">${msg}</div>
    <div class="tablewrap"><table><thead><tr><th>Player</th><th>Email</th><th>Score</th><th>Capabilities</th><th>Started</th><th>Completed</th><th>Tablet</th><th>Status</th><th>Sync</th></tr></thead>
    <tbody>${all.slice().reverse().map(r => `<tr><td>#${r.playerNo}</td><td>${r.email}</td><td>${r.score}</td><td>${res(r)}</td><td>${fmt(r.startedAt)}</td><td>${fmt(r.completedAt)}</td><td>${r.tablet}</td><td>${r.status}</td><td>${r.sync}</td></tr>`).join("") || `<tr><td colspan="9">No players yet.</td></tr>`}</tbody></table></div>`;
  staff.classList.add("open");
  $("#cls").onclick = () => { staff.classList.remove("open"); settings.paused = false; $("#pause").checked = false; };
  $("#stab").value = settings.tablet;
  $("#stab").onchange = e => { settings.tablet = e.target.value; store.set("fr_tablet", settings.tablet); $("#tablet").value = settings.tablet; openStaff("This iPad is now tablet " + settings.tablet + "."); };

  $("#rev").onclick = () => { const on = document.body.classList.toggle("show-review"); store.set("fr_review_hidden", !on); openStaff(); };

}
